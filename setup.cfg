[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,venv,build,dist,legacy
max-complexity = 25

[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --strict-markers
# Put the repository root on sys.path so `pytest` works the same way as
# `python -m pytest`, locally and on the CI runner.
pythonpath = .
